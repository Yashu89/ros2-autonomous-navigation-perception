planner_server:
  ros__parameters:
    use_sim_time: true

    expected_planner_frequency: 5.0

    planner_plugins: ["GridBased"]

    GridBased:
      plugin: "nav2_navfn_planner::NavfnPlanner"
      tolerance: 0.25
      use_astar: true
      allow_unknown: true

global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: true

      global_frame: map
      robot_base_frame: base_link

      update_frequency: 5.0
      publish_frequency: 2.0

      resolution: 0.05
      track_unknown_space: true
      
      footprint: "[[0.5, 0.315],
             [0.5, -0.315],
             [-0.5, -0.315],
             [-0.5, 0.315]]"

      plugins:
        - static_layer
        - obstacle_layer
        - inflation_layer
      
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: true
        map_topic: /map
      
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"

        enabled: true
        observation_sources: scan depth

        scan:
          topic: /scan
          data_type: LaserScan

          marking: true
          clearing: true

          obstacle_max_range: 8.0
          raytrace_max_range: 10.0

          obstacle_min_range: 0.05
          raytrace_min_range: 0.05

          max_obstacle_height: 1.0
          min_obstacle_height: 0.0

        depth:
          topic: /camera/image_raw/points
          data_type: PointCloud2
          marking: true
          clearing: true
          obstacle_max_range: 4.5
          obstacle_min_range: 0.15
          max_obstacle_height: 2.0
          min_obstacle_height: -0.07
          raytrace_max_range: 5.0
          raytrace_min_range: 0.0
          
        
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"

        cost_scaling_factor: 2.8
        inflation_radius: 0.40

      always_send_full_costmap: true

controller_server:
  ros__parameters:
    use_sim_time: true

    controller_frequency: 20.0

    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.001
    min_theta_velocity_threshold: 0.001

    failure_tolerance: 0.5

    progress_checker_plugins: ["progress_checker"]
    goal_checker_plugins: ["goal_checker"]
    controller_plugins: ["FollowPath"]

    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.10
      movement_time_allowance: 10.0

    goal_checker:
      plugin: "nav2_controller::SimpleGoalChecker"
      stateful: true
      xy_goal_tolerance: 0.20
      yaw_goal_tolerance: 0.20

    FollowPath:
      plugin: "nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController"

      desired_linear_vel: 0.45

      lookahead_dist: 0.4
      min_lookahead_dist: 0.25
      max_lookahead_dist: 0.6

      lookahead_time: 1.5

      rotate_to_heading_angular_vel: 0.8
      rotate_to_heading_min_angle: 1.047

      transform_tolerance: 0.1
      
      use_velocity_scaled_lookahead_dist: true

      min_approach_linear_velocity: 0.10
      approach_velocity_scaling_dist: 0.4

      use_regulated_linear_velocity_scaling: true
      use_cost_regulated_linear_velocity_scaling: true

      cost_scaling_dist: 0.4
      cost_scaling_gain: 0.2

      regulated_linear_scaling_min_radius: 0.9
      regulated_linear_scaling_min_speed: 0.25

      use_rotate_to_heading: true
      allow_reversing: false

      use_collision_detection: true

      max_allowed_time_to_collision_up_to_carrot: 1.0

      use_fixed_curvature_lookahead: false

local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: true

      global_frame: odom
      robot_base_frame: base_link

      update_frequency: 10.0
      publish_frequency: 5.0

      rolling_window: true

      width: 6
      height: 6
      resolution: 0.05

      footprint: "[[0.50, 0.315],
             [0.50, -0.315],
             [-0.50, -0.315],
             [-0.50, 0.315]]"

      plugins:
        - obstacle_layer
        - inflation_layer
      
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true

        observation_sources: scan depth

        scan:
          topic: /scan
          data_type: LaserScan

          marking: true
          clearing: true

          obstacle_max_range: 8.0
          raytrace_max_range: 10.0

          obstacle_min_range: 0.05
          raytrace_min_range: 0.05

          max_obstacle_height: 1.0
          min_obstacle_height: 0.0

        depth:
          topic: /camera/image_raw/points
          data_type: PointCloud2
          marking: true
          clearing: true
          obstacle_max_range: 4.0
          obstacle_min_range: 0.20
          max_obstacle_height: 1.5
          min_obstacle_height: -0.07
          raytrace_max_range: 5.0
          raytrace_min_range: 0.0
        
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"

        cost_scaling_factor: 2.8
        inflation_radius: 0.40

      always_send_full_costmap: true

bt_navigator:
  ros__parameters:
      use_sim_time: true

      global_frame: map
      robot_base_frame: base_link
      odom_topic: /diff_drive_controller/odom

      default_nav_to_pose_bt_xml: "/opt/ros/jazzy/share/nav2_bt_navigator/behavior_trees/navigate_to_pose_w_replanning_and_recovery.xml"
      default_nav_through_poses_bt_xml: "/opt/ros/jazzy/share/nav2_bt_navigator/behavior_trees/navigate_through_poses_w_replanning_and_recovery.xml"

behavior_server:
  ros__parameters:
    use_sim_time: true

    global_frame: odom
    robot_base_frame: base_link

    cycle_frequency: 10.0

    behavior_plugins:
      - spin 
      - backup 
      - wait 
    
    spin: 
      plugin: "nav2_behaviors::Spin"

    backup:
      plugin: "nav2_behaviors::BackUp"

    wait:
      plugin: "nav2_behaviors::Wait"
    
    simulated_ahead_time: 2.0

    max_rotational_vel: 1.0
    min_rotational_vel: 0.1
    rotational_acc_lim: 3.2

lifecycle_manager:
  ros__parameters:
    use_sim_time: true

    autostart: true

    node_names:
      - planner_server
      - controller_server
      - bt_navigator
      - behavior_server